<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Confirmar asistencia | Carolina & Esthefano</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <main class="detail-page">
    <section class="detail-card">
      <h1 class="script-title">Confirmar asistencia</h1>
      <p class="sub" id="rsvpSubtitle">Completa los datos de tu grupo.</p>

      <form id="rsvpForm">
        <div id="closedInviteFields" class="hidden">
          <div id="closedInviteTitle" class="personalized-rsvp-title"></div>
          <p class="small-muted">Marca quiénes asistirán. Esta invitación solo permite registrar a las personas incluidas por los novios.</p>
          <div id="closedMembers" class="members-box"></div>
        </div>

        <div id="openFamilyFields" class="hidden">
          <div id="openFamilyTitle" class="personalized-rsvp-title"></div>
          <p class="small-muted">Esta invitación permite que la familia registre libremente quiénes asistirán.</p>

          <label for="openAttendance">¿Asistirán?</label>
          <select id="openAttendance">
            <option value="yes">Sí, asistiremos</option>
            <option value="no">No podremos asistir</option>
          </select>

          <div id="openMembersBox" class="members-box"></div>
          <button class="mini-button" type="button" id="addOpenMemberBtn">Agregar otra persona</button>
        </div>

        <div id="generalFields" class="hidden">
          <label for="confirmante">Familia de quien confirma</label>
          <input id="confirmante" name="confirmante" type="text" placeholder="Ejemplo: Familia Morales Sandoval" />

          <label for="generalAttendance">¿Asistirán?</label>
          <select id="generalAttendance">
            <option value="yes">Sí, asistiremos</option>
            <option value="no">No podremos asistir</option>
          </select>

          <div id="generalMembersBox" class="members-box"></div>
          <button class="mini-button" type="button" id="addGeneralMemberBtn">Agregar otra persona</button>
        </div>

        <label for="mensaje">Mensaje para los novios</label>
        <textarea id="mensaje" name="mensaje"></textarea>

        <button class="green-button" type="submit" id="submitRsvpBtn">Enviar confirmación</button>
        <p class="status" id="status"></p>
      </form>

      <a class="back-link" id="backToInvite" href="index.html">Volver a la invitación</a>
    </section>
  </main>

  <script>
    const form = document.getElementById("rsvpForm");
    const statusText = document.getElementById("status");
    const submitRsvpBtn = document.getElementById("submitRsvpBtn");
    const inviteToken = new URLSearchParams(window.location.search).get("inv") || "";
    const supabaseClient = (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase)
      ? supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
      : null;
    let personalizedInvite = null;
    let openMemberCount = 0;
    let generalMemberCount = 0;

    const closedInviteFields = document.getElementById("closedInviteFields");
    const openFamilyFields = document.getElementById("openFamilyFields");
    const generalFields = document.getElementById("generalFields");
    const openMembersBox = document.getElementById("openMembersBox");
    const generalMembersBox = document.getElementById("generalMembersBox");
    const backToInvite = document.getElementById("backToInvite");

    if (window.parent !== window) {
      backToInvite.addEventListener("click", function(event) {
        event.preventDefault();
        window.parent.postMessage({ type: "closeInviteOverlay" }, window.location.origin);
      });
    } else if (inviteToken) {
      backToInvite.href = "index.html?inv=" + encodeURIComponent(inviteToken);
    }

    function formatInviteNames(names) {
      const clean = (names || []).filter(Boolean);
      if (!clean.length) return "";
      if (clean.length === 1) return clean[0];
      if (clean.length === 2) return clean[0] + " y " + clean[1];
      return clean.slice(0, -1).join(", ") + " y " + clean[clean.length - 1];
    }

    function addFreeMember(container, prefix, countRef) {
      const index = countRef();
      const item = document.createElement("div");
      item.className = "member-entry free-member-entry";
      item.dataset.memberIndex = index;

      const nameLabel = document.createElement("label");
      nameLabel.textContent = "Nombre y apellido";
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.className = prefix + "-member-name";
      nameInput.placeholder = "Nombre y apellido";

      const phoneLabel = document.createElement("label");
      phoneLabel.textContent = "WhatsApp o teléfono (opcional)";
      const phoneInput = document.createElement("input");
      phoneInput.type = "tel";
      phoneInput.className = prefix + "-member-contact";
      phoneInput.placeholder = "Contacto";

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "mini-button";
      remove.textContent = "Quitar persona";
      remove.addEventListener("click", function(){
        if (container.querySelectorAll(".free-member-entry").length > 1) item.remove();
      });

      item.appendChild(nameLabel); item.appendChild(nameInput);
      item.appendChild(phoneLabel); item.appendChild(phoneInput); item.appendChild(remove);
      container.appendChild(item);
    }

    function nextOpenIndex(){ openMemberCount += 1; return openMemberCount; }
    function nextGeneralIndex(){ generalMemberCount += 1; return generalMemberCount; }

    function renderClosedMembers(names) {
      const box = document.getElementById("closedMembers"); box.innerHTML = "";
      names.forEach(function(name, index){
        const item = document.createElement("div"); item.className = "personalized-member-entry";
        const row = document.createElement("label"); row.className = "attendance-check";
        const checkbox = document.createElement("input"); checkbox.type = "checkbox"; checkbox.name = "closed_asiste"; checkbox.value = name; checkbox.checked = true;
        const span = document.createElement("span"); span.textContent = name;
        row.appendChild(checkbox); row.appendChild(span); item.appendChild(row);
        const phoneLabel = document.createElement("label"); phoneLabel.textContent = "WhatsApp o teléfono (opcional)";
        const phoneInput = document.createElement("input"); phoneInput.type = "tel"; phoneInput.className = "closed-contact"; phoneInput.dataset.name = name; phoneInput.placeholder = "Contacto";
        item.appendChild(phoneLabel); item.appendChild(phoneInput); box.appendChild(item);
      });
    }

    function toggleOpenAttendance() {
      const attending = document.getElementById("openAttendance").value === "yes";
      openMembersBox.classList.toggle("hidden", !attending);
      document.getElementById("addOpenMemberBtn").classList.toggle("hidden", !attending);
    }

    function toggleGeneralAttendance() {
      const attending = document.getElementById("generalAttendance").value === "yes";
      generalMembersBox.classList.toggle("hidden", !attending);
      document.getElementById("addGeneralMemberBtn").classList.toggle("hidden", !attending);
    }

    document.getElementById("openAttendance").addEventListener("change", toggleOpenAttendance);
    document.getElementById("generalAttendance").addEventListener("change", toggleGeneralAttendance);
    document.getElementById("addOpenMemberBtn").addEventListener("click", () => addFreeMember(openMembersBox, "open", nextOpenIndex));
    document.getElementById("addGeneralMemberBtn").addEventListener("click", () => addFreeMember(generalMembersBox, "general", nextGeneralIndex));

    function collectFreeMembers(prefix) {
      const names = [];
      const contacts = {};
      document.querySelectorAll("." + prefix + "-member-name").forEach(function(input, index){
        const name = input.value.trim();
        if (!name) return;
        names.push(name);
        const phone = document.querySelectorAll("." + prefix + "-member-contact")[index]?.value.trim() || "";
        contacts[name] = phone;
      });
      return { names, contacts };
    }

    async function loadInvite() {
      if (!supabaseClient) {
        statusText.textContent = "Falta configurar Supabase.";
        submitRsvpBtn.disabled = true;
        return;
      }

      if (!inviteToken) {
        generalFields.classList.remove("hidden");
        addFreeMember(generalMembersBox, "general", nextGeneralIndex);
        toggleGeneralAttendance();
        return;
      }

      statusText.textContent = "Cargando invitación...";
      submitRsvpBtn.disabled = true;
      const result = await supabaseClient.rpc("obtener_invitacion_personalizada", { p_token: inviteToken });
      const invitation = result.data && result.data[0];
      if (result.error || !invitation) {
        console.error(result.error);
        statusText.textContent = "Este link no es válido o fue desactivado.";
        return;
      }

      personalizedInvite = invitation;
      if (invitation.tipo === "familia_libre") {
        openFamilyFields.classList.remove("hidden");
        document.getElementById("openFamilyTitle").textContent = invitation.titulo_portada || ("Invitación para la " + invitation.familia);
        document.getElementById("rsvpSubtitle").textContent = "Registra las personas de tu familia que asistirán.";
        addFreeMember(openMembersBox, "open", nextOpenIndex);
        toggleOpenAttendance();
      } else {
        closedInviteFields.classList.remove("hidden");
        document.getElementById("closedInviteTitle").textContent = invitation.titulo_portada || ("Para " + formatInviteNames(invitation.invitados || []));
        document.getElementById("rsvpSubtitle").textContent = "Confirma la asistencia de las personas incluidas en esta invitación.";
        renderClosedMembers(invitation.invitados || []);
      }
      statusText.textContent = "";
      submitRsvpBtn.disabled = false;
    }

    form.addEventListener("submit", async function(event){
      event.preventDefault();
      if (!supabaseClient) return;
      submitRsvpBtn.disabled = true;
      statusText.textContent = "Enviando confirmación...";
      const message = document.getElementById("mensaje").value.trim();

      if (inviteToken && personalizedInvite?.tipo === "lista_cerrada") {
        const asistentes = Array.from(document.querySelectorAll('input[name="closed_asiste"]:checked')).map(i => i.value);
        const contactos = {};
        document.querySelectorAll(".closed-contact").forEach(i => contactos[i.dataset.name] = i.value.trim());
        const result = await supabaseClient.rpc("confirmar_invitacion_personalizada", { p_token:inviteToken, p_asistentes:asistentes, p_contactos:contactos, p_mensaje:message });
        if (result.error) { console.error(result.error); statusText.textContent = "No se pudo guardar la confirmación."; submitRsvpBtn.disabled = false; return; }
        statusText.textContent = asistentes.length ? "Confirmación enviada. Muchas gracias." : "Registramos que no podrán asistir. Muchas gracias.";
        submitRsvpBtn.disabled = false; return;
      }

      if (inviteToken && personalizedInvite?.tipo === "familia_libre") {
        const attending = document.getElementById("openAttendance").value === "yes";
        const data = attending ? collectFreeMembers("open") : {names:[],contacts:{}};
        if (attending && !data.names.length) { statusText.textContent = "Agrega al menos una persona que asistirá."; submitRsvpBtn.disabled = false; return; }
        const result = await supabaseClient.rpc("confirmar_invitacion_familia_libre", { p_token:inviteToken, p_nombres:data.names, p_contactos:data.contacts, p_mensaje:message });
        if (result.error) { console.error(result.error); statusText.textContent = "No se pudo guardar la confirmación."; submitRsvpBtn.disabled = false; return; }
        statusText.textContent = attending ? "Confirmación enviada. Muchas gracias." : "Registramos que la familia no podrá asistir. Muchas gracias.";
        submitRsvpBtn.disabled = false; return;
      }

      const family = document.getElementById("confirmante").value.trim();
      const attending = document.getElementById("generalAttendance").value === "yes";
      const data = attending ? collectFreeMembers("general") : {names:[family],contacts:{}};
      if (!family) { statusText.textContent = "Indica el nombre de la familia."; submitRsvpBtn.disabled = false; return; }
      if (attending && !data.names.length) { statusText.textContent = "Agrega al menos una persona."; submitRsvpBtn.disabled = false; return; }
      const groupId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
      const rows = data.names.map(name => ({ nombre:name, asistencia:attending?"Sí asistiré":"No podré asistir", cantidad:1, confirmante:family, telefono:data.contacts[name]||"", contacto_integrante:data.contacts[name]||"", mensaje:message, grupo_id:groupId }));
      const result = await supabaseClient.from("invitados").insert(rows);
      if (result.error) { console.error(result.error); statusText.textContent = "No se pudo enviar la confirmación."; submitRsvpBtn.disabled = false; return; }
      statusText.textContent = "Confirmación enviada. Muchas gracias."; submitRsvpBtn.disabled = false;
    });

    loadInvite();
  </script>
</body>
</html>
