<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Administrador | Carolina & Esthefano</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <main class="detail-page">
    <section class="detail-card">
      <h1 class="script-title">Administrador</h1>
      <p class="sub">Panel para revisar todos los campos rellenados en el formulario.</p>

      <div id="loginBox">
        <label for="adminEmail">Correo administrador</label>
        <input id="adminEmail" type="email" placeholder="correo administrador" />

        <label for="adminPassword">Contraseña</label>
        <input id="adminPassword" type="password" placeholder="contraseña" />

        <button class="green-button" type="button" id="loginBtn">Ingresar</button>
        <p class="status" id="loginStatus"></p>
      </div>

      <div id="adminPanel" class="hidden">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-number" id="visitasCount">0</div><div class="stat-label">Visitas</div></div>
          <div class="stat-card"><div class="stat-number" id="confirmadosCount">0</div><div class="stat-label">Grupos confirmados</div></div>
          <div class="stat-card"><div class="stat-number" id="asistentesCount">0</div><div class="stat-label">Asistentes</div></div>
          <div class="stat-card"><div class="stat-number" id="noAsistenCount">0</div><div class="stat-label">No asisten</div></div>
        </div>
        <button class="green-button" type="button" id="refreshBtn">Actualizar</button>
        <button class="green-button" type="button" id="logoutBtn">Cerrar sesión</button>
        <div class="admin-list" id="guestList"></div>
      </div>

      <a class="back-link" href="index.html">Volver a la invitación</a>
    </section>
  </main>

  <script>
    const ADMIN_EMAIL = "sthefanomc@gmail.com";
    const loginBox = document.getElementById("loginBox");
    const adminPanel = document.getElementById("adminPanel");
    const loginStatus = document.getElementById("loginStatus");
    const emailInput = document.getElementById("adminEmail");
    const passwordInput = document.getElementById("adminPassword");
    const client = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    function showPanel() {
      loginBox.classList.add("hidden");
      adminPanel.classList.remove("hidden");
      loadAdminData();
    }

    function cleanPhone(phone) {
      let number = String(phone || "").replace(/\D/g, "");
      if (!number) return "";
      if (number.startsWith("56")) return number;
      if (number.length === 9 && number.startsWith("9")) return "56" + number;
      if (number.length === 8) return "569" + number;
      return number;
    }

    function defaultMessage(name) {
      return "Hola " + (name || "") + ", somos Carolina y Esthefano. Te escribimos por la confirmación de nuestra boda.";
    }

    function textLine(parent, label, value) {
      const p = document.createElement("p");
      const strong = document.createElement("strong");
      strong.textContent = label + ": ";
      p.appendChild(strong);
      p.appendChild(document.createTextNode(value || ""));
      parent.appendChild(p);
    }

    async function loadAdminData() {
      const visitas = await client.from("invitacion_visitas").select("id", { count: "exact", head: true });
      const invitados = await client.from("invitados").select("*").order("created_at", { ascending: false });
      const rows = invitados.data || [];
      const confirmados = rows.filter(function(r){ return r.asistencia === "Sí asistiré"; });
      const noAsisten = rows.filter(function(r){ return r.asistencia === "No podré asistir"; });
      const grupos = new Set(rows.map(function(r){ return r.grupo_id || r.confirmante || r.id; }));

      document.getElementById("visitasCount").textContent = visitas.count || 0;
      document.getElementById("confirmadosCount").textContent = grupos.size;
      document.getElementById("asistentesCount").textContent = confirmados.length;
      document.getElementById("noAsistenCount").textContent = noAsisten.length;

      const list = document.getElementById("guestList");
      list.innerHTML = "";

      if (!rows.length) {
        list.innerHTML = "<p class='status'>Aún no hay confirmaciones.</p>";
        return;
      }

      rows.forEach(function(r){
        const card = document.createElement("article");
        card.className = "guest-card";

        const title = document.createElement("h3");
        title.textContent = r.nombre || "Sin nombre";
        card.appendChild(title);

        textLine(card, "Familia de quien confirma", r.confirmante || "");
        textLine(card, "¿Asistirán?", r.asistencia || "");
        textLine(card, "Cantidad de asistentes", "1");
        textLine(card, "Nombre y apellido del integrante", r.nombre || "");
        textLine(card, "Contacto del integrante", r.contacto_integrante || r.telefono || "Sin contacto");
        textLine(card, "Mensaje para los novios", r.mensaje || "");
        textLine(card, "Grupo de confirmación", r.grupo_id || "");

        const fecha = document.createElement("p");
        fecha.className = "small-muted";
        fecha.textContent = r.created_at ? "Fecha de registro: " + new Date(r.created_at).toLocaleString("es-CL") : "";
        card.appendChild(fecha);

        const phone = cleanPhone(r.contacto_integrante || r.telefono);
        if (phone) {
          const whatsapp = document.createElement("a");
          whatsapp.className = "whatsapp-button";
          whatsapp.href = "https://wa.me/" + phone + "?text=" + encodeURIComponent(defaultMessage(r.nombre));
          whatsapp.target = "_blank";
          whatsapp.rel = "noopener noreferrer";
          whatsapp.textContent = "Enviar mensaje por WhatsApp";
          card.appendChild(whatsapp);
        }

        list.appendChild(card);
      });
    }

    async function checkSession() {
      const sessionData = await client.auth.getSession();
      const session = sessionData.data.session;
      if (session && session.user && session.user.email === ADMIN_EMAIL) {
        showPanel();
      }
    }

    document.getElementById("loginBtn").addEventListener("click", async function(){
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (email !== ADMIN_EMAIL) {
        loginStatus.textContent = "Correo no autorizado.";
        return;
      }

      if (!password) {
        loginStatus.textContent = "Ingresa la contraseña.";
        return;
      }

      loginStatus.textContent = "Ingresando...";
      const result = await client.auth.signInWithPassword({ email: email, password: password });

      if (result.error) {
        loginStatus.textContent = "Correo o contraseña incorrectos.";
        return;
      }

      if (!result.data.user || result.data.user.email !== ADMIN_EMAIL) {
        await client.auth.signOut();
        loginStatus.textContent = "Usuario no autorizado.";
        return;
      }

      showPanel();
    });

    document.getElementById("refreshBtn").addEventListener("click", loadAdminData);
    document.getElementById("logoutBtn").addEventListener("click", async function(){ await client.auth.signOut(); window.location.reload(); });
    checkSession();
  </script>
</body>
</html>
