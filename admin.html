<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Administrador | Carolina & Esthefano</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body class="admin-body">
  <main class="admin-page">
    <section class="admin-card">
      <h1 class="script-title">Administrador</h1>
      <p class="sub">Panel ordenado por familias, asistentes y estado de confirmación.</p>

      <div id="loginBox">
        <label for="adminEmail">Correo administrador</label>
        <input id="adminEmail" type="email" placeholder="correo administrador" />

        <label for="adminPassword">Contraseña</label>
        <input id="adminPassword" type="password" placeholder="contraseña" />

        <button class="green-button" type="button" id="loginBtn">Ingresar</button>
        <p class="status" id="loginStatus"></p>
      </div>

      <div id="adminPanel" class="hidden">
        <div class="stats-grid admin-stats">
          <div class="stat-card"><div class="stat-number" id="visitasCount">0</div><div class="stat-label">Visitas</div></div>
          <div class="stat-card"><div class="stat-number" id="confirmadosCount">0</div><div class="stat-label">Familias</div></div>
          <div class="stat-card"><div class="stat-number" id="asistentesCount">0</div><div class="stat-label">Asistentes</div></div>
          <div class="stat-card"><div class="stat-number" id="noAsistenCount">0</div><div class="stat-label">No asisten</div></div>
        </div>

        <div class="admin-actions">
          <button class="green-button" type="button" id="refreshBtn">Actualizar</button>
          <button class="green-button" type="button" id="logoutBtn">Cerrar sesión</button>
        </div>

        <div class="admin-section">
          <h2>Resumen por familia</h2>
          <div id="familyList"></div>
        </div>

        <div class="admin-section">
          <h2>Listado completo de asistentes</h2>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Familia</th>
                  <th>Asistente</th>
                  <th>Estado</th>
                  <th>Contacto</th>
                  <th>Mensaje</th>
                  <th>WhatsApp</th>
                </tr>
              </thead>
              <tbody id="guestTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <a class="back-link" href="index.html">Volver a la invitación</a>
    </section>
  </main>

  <script>
    const ADMIN_EMAIL = "sthefanomc@gmail.com";
    const loginBox = document.getElementById("loginBox");
    const adminPanel = document.getElementById("adminPanel");
    const loginStatus = document.getElementById("loginStatus");
    const emailInput = document.getElementById("adminEmail");
    const passwordInput = document.getElementById("adminPassword");
    const client = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    function showPanel() {
      loginBox.classList.add("hidden");
      adminPanel.classList.remove("hidden");
      loadAdminData();
    }

    function cleanPhone(phone) {
      let number = String(phone || "").replace(/\D/g, "");
      if (!number) return "";
      if (number.startsWith("56")) return number;
      if (number.length === 9 && number.startsWith("9")) return "56" + number;
      if (number.length === 8) return "569" + number;
      return number;
    }

    function defaultMessage(name) {
      return "Hola " + (name || "") + ", somos Carolina y Esthefano. Te escribimos por la confirmación de nuestra boda.";
    }

    function makeWhatsapp(phone, name) {
      const number = cleanPhone(phone);
      if (!number) return null;
      const a = document.createElement("a");
      a.className = "whatsapp-small";
      a.href = "https://wa.me/" + number + "?text=" + encodeURIComponent(defaultMessage(name));
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Enviar";
      return a;
    }

    function normalizeRow(r) {
      return {
        familia: r.confirmante || "Sin familia registrada",
        asistente: r.nombre || "Sin nombre",
        estado: r.asistencia || "Sin estado",
        contacto: r.contacto_integrante || r.telefono || "",
        mensaje: r.mensaje || "",
        grupo: r.grupo_id || r.confirmante || r.id,
        fecha: r.created_at || ""
      };
    }

    function groupByFamily(rows) {
      const groups = {};
      rows.forEach(function(raw){
        const r = normalizeRow(raw);
        const key = r.grupo || r.familia;
        if (!groups[key]) {
          groups[key] = { familia: r.familia, estado: r.estado, mensaje: r.mensaje, fecha: r.fecha, asistentes: [] };
        }
        groups[key].asistentes.push(r);
      });
      return Object.values(groups);
    }

    function renderFamilies(rows) {
      const container = document.getElementById("familyList");
      container.innerHTML = "";
      const families = groupByFamily(rows);

      families.forEach(function(family){
        const card = document.createElement("article");
        card.className = "family-card";

        const header = document.createElement("div");
        header.className = "family-header";
        header.innerHTML = "<div><h3>" + family.familia + "</h3><p>" + family.estado + "</p></div><span>" + family.asistentes.length + " integrante(s)</span>";
        card.appendChild(header);

        const table = document.createElement("table");
        table.className = "mini-table";
        table.innerHTML = "<thead><tr><th>Asistente</th><th>Contacto</th><th>WhatsApp</th></tr></thead>";
        const tbody = document.createElement("tbody");

        family.asistentes.forEach(function(person){
          const tr = document.createElement("tr");
          const tdName = document.createElement("td");
          const tdPhone = document.createElement("td");
          const tdWhatsapp = document.createElement("td");
          tdName.textContent = person.asistente;
          tdPhone.textContent = person.contacto || "Sin contacto";
          const link = makeWhatsapp(person.contacto, person.asistente);
          tdWhatsapp.appendChild(link || document.createTextNode("-"));
          tr.appendChild(tdName);
          tr.appendChild(tdPhone);
          tr.appendChild(tdWhatsapp);
          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        card.appendChild(table);

        if (family.mensaje) {
          const msg = document.createElement("p");
          msg.className = "family-message";
          msg.textContent = "Mensaje: " + family.mensaje;
          card.appendChild(msg);
        }

        container.appendChild(card);
      });
    }

    function renderTable(rows) {
      const tbody = document.getElementById("guestTable");
      tbody.innerHTML = "";
      rows.map(normalizeRow).forEach(function(r){
        const tr = document.createElement("tr");
        [r.familia, r.asistente, r.estado, r.contacto || "Sin contacto", r.mensaje || "-"].forEach(function(value){
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        });
        const tdWhatsapp = document.createElement("td");
        const link = makeWhatsapp(r.contacto, r.asistente);
        tdWhatsapp.appendChild(link || document.createTextNode("-"));
        tr.appendChild(tdWhatsapp);
        tbody.appendChild(tr);
      });
    }

    async function loadAdminData() {
      const visitas = await client.from("invitacion_visitas").select("id", { count: "exact", head: true });
      const invitados = await client.from("invitados").select("*").order("created_at", { ascending: false });
      const rows = invitados.data || [];
      const normalized = rows.map(normalizeRow);
      const confirmados = normalized.filter(function(r){ return r.estado === "Sí asistiré"; });
      const noAsisten = normalized.filter(function(r){ return r.estado === "No podré asistir"; });
      const grupos = new Set(normalized.map(function(r){ return r.grupo; }));

      document.getElementById("visitasCount").textContent = visitas.count || 0;
      document.getElementById("confirmadosCount").textContent = grupos.size;
      document.getElementById("asistentesCount").textContent = confirmados.length;
      document.getElementById("noAsistenCount").textContent = noAsisten.length;

      if (!rows.length) {
        document.getElementById("familyList").innerHTML = "<p class='status'>Aún no hay confirmaciones.</p>";
        document.getElementById("guestTable").innerHTML = "";
        return;
      }

      renderFamilies(rows);
      renderTable(rows);
    }

    async function checkSession() {
      const sessionData = await client.auth.getSession();
      const session = sessionData.data.session;
      if (session && session.user && session.user.email === ADMIN_EMAIL) {
        showPanel();
      }
    }

    document.getElementById("loginBtn").addEventListener("click", async function(){
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (email !== ADMIN_EMAIL) {
        loginStatus.textContent = "Correo no autorizado.";
        return;
      }

      if (!password) {
        loginStatus.textContent = "Ingresa la contraseña.";
        return;
      }

      loginStatus.textContent = "Ingresando...";
      const result = await client.auth.signInWithPassword({ email: email, password: password });

      if (result.error) {
        loginStatus.textContent = "Correo o contraseña incorrectos.";
        return;
      }

      if (!result.data.user || result.data.user.email !== ADMIN_EMAIL) {
        await client.auth.signOut();
        loginStatus.textContent = "Usuario no autorizado.";
        return;
      }

      showPanel();
    });

    document.getElementById("refreshBtn").addEventListener("click", loadAdminData);
    document.getElementById("logoutBtn").addEventListener("click", async function(){ await client.auth.signOut(); window.location.reload(); });
    checkSession();
  </script>
</body>
</html>
