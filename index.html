<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ec" />
  <meta name="description" content="Invitación digital de boda de Carolina Vega Carrera y Esthefano Morales Campaña." />
  <title>Carolina & Esthefano | Invitación digital</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <main class="page" aria-label="Invitación digital de boda Carolina y Esthefano">
    <section class="invite-shell">

      <div class="invite-part">
        <img class="invite-image" src="assets/parte-1.png" alt="Invitación de boda Carolina y Esthefano - Parte 1" />
      </div>

      <div class="invite-part">
        <img class="invite-image" src="assets/parte-2.png" alt="Invitación de boda Carolina y Esthefano - Parte 2" />

        <a
          class="hotspot ubicacion"
          href="https://www.google.com/maps/search/?api=1&query=Iglesia%20Catedral%20de%20Antofagasta"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Ver ubicación de la Iglesia Catedral de Antofagasta"
        ></a>
      </div>

      <div class="invite-part">
        <img class="invite-image" src="assets/parte-3.png" alt="Invitación de boda Carolina y Esthefano - Parte 3" />

        <a class="hotspot confirmar" href="confirmar.html" aria-label="Confirmar asistencia"></a>

        <a class="hotspot ver-datos" href="datos.html" aria-label="Ver datos bancarios"></a>
      </div>

      <a class="admin-link" href="admin.html">Administrador</a>
    </section>
  </main>
  <script>
    if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase) {
      const client = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      client.from("invitacion_visitas").insert([{ pagina: "invitacion" }]);
    }
  </script>
</body>
</html>
